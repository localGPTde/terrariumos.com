<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrarium</title>
<meta name="description" content="Become self-sustained in software.">
<meta property="og:title" content="Terrarium">
<meta property="og:description" content="Become self-sustained in software.">
<meta property="og:url" content="https://terrariumos.com">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23E7FF00' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
<style>
  :root { --ink:#000000; --paper:#FFFFFF; --gray:#D2D2D2; --lime:#E7FF00; --dim:#8A8A8A;
          --font:"Archivo","Liberation Sans","Helvetica Neue",Arial,sans-serif; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--font);
         display: grid; grid-template-rows: 1fr auto; min-height: 100svh;
         padding: env(safe-area-inset-top, 0px) clamp(20px, 5vw, 72px) 0; }
  :focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }
  main { display: grid; align-items: center; }
  h1 { margin: 0; font-weight: 750; font-variation-settings: "wdth" 112;
       font-size: clamp(34px, 6.3vw, 100px); line-height: .96; letter-spacing: -0.035em; }
  h1 span { white-space: nowrap; }
  footer { padding-block: 24px calc(28px + env(safe-area-inset-bottom, 0px)); }
  form.join { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 420px; }
  .join input[type=email] { flex: 1 1 200px; min-width: 0; height: 36px; padding: 0 12px;
       font: inherit; font-size: 13px; font-weight: 300; color: var(--gray);
       background: transparent; border: 1px solid #333; border-radius: 0; }
  .join input[type=email]::placeholder { color: #666; }
  .join input[type=email]:focus { border-color: #777; outline: none; }
  .join button { height: 36px; padding: 0 14px; font: inherit; font-size: 13px; font-weight: 400;
       color: var(--dim); background: transparent; border: 1px solid #333; border-radius: 0; cursor: pointer; }
  .join button:hover { color: var(--paper); border-color: #777; }
  .join button[disabled] { cursor: progress; opacity: .6; }
  .hp { position: absolute !important; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
  .status { min-height: 1.4em; margin: 8px 0 0; font-size: 12px; font-weight: 300; color: var(--dim); }
  .status.ok { color: var(--gray); }
  .status.err { color: #C98080; }
</style>
</head>
<body>
<main>
  <h1>Become<br> <span>self‑sustained</span><br> in software.</h1>
</main>
<footer>
  <form class="join" novalidate>
    <label class="hp" aria-hidden="true">Website <input type="text" name="website" tabindex="-1" autocomplete="off"></label>
    <label for="email" class="hp">Email</label>
    <input id="email" type="email" name="email" placeholder="your email" autocomplete="email" required>
    <button type="submit">Join the waiting list</button>
  </form>
  <p class="status" role="status" aria-live="polite"></p>
</footer>
<script>
(function () {
  var ENDPOINT = "https://xbqeogrfsbfmbvoipuvt.supabase.co/functions/v1/terrarium-waitlist";
  var EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

  function setStatus(el, text, kind) {
    el.textContent = text;
    el.className = "status" + (kind ? " " + kind : "");
  }

  document.querySelectorAll("form.join").forEach(function (form) {
    var status = form.parentElement.querySelector(".status");
    var button = form.querySelector("button");
    var input = form.querySelector("input[type=email]");

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      var email = input.value.trim();
      if (!EMAIL_RE.test(email)) {
        setStatus(status, "Enter a valid work email address.", "err");
        input.focus();
        return;
      }
      button.disabled = true;
      button.textContent = "Joining…";
      setStatus(status, "", "");

      var ctrl = "AbortController" in window ? new AbortController() : null;
      var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 12000);

      fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: email, website: form.querySelector("[name=website]").value, source: location.hostname }),
        signal: ctrl ? ctrl.signal : undefined
      })
        .then(function (res) {
          return res.json().catch(function () { return {}; }).then(function (body) { return { ok: res.ok, body: body }; });
        })
        .then(function (r) {
          if (r.ok && r.body.ok) {
            input.value = "";
            setStatus(status, r.body.already ? "You're already on the waiting list." : "You're on the waiting list. We'll write to you before launch.", "ok");
          } else {
            setStatus(status, r.body.error || "We couldn't save your signup. Try again in a minute.", "err");
          }
        })
        .catch(function (err) {
          var msg = !navigator.onLine ? "You're offline. Reconnect and try again."
            : (err && err.name === "AbortError") ? "The request timed out. Try again."
            : "We couldn't reach the server. Try again in a minute.";
          setStatus(status, msg, "err");
        })
        .then(function () {
          clearTimeout(timer);
          button.disabled = false;
          button.textContent = "Join the waiting list";
        });
    });
  });
})();
</script>
</body>
</html>
